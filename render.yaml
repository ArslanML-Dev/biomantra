# Render blueprint for the Bio Mantra backend (free web service, Docker image from backend/Dockerfile).
# Render sets PORT itself. ADMIN_TOKEN is generated by Render (Dashboard → biomantra-api → Environment to read it).
# Free tier: sleeps after ~15 min without requests (first request then takes ~1 min); /tmp data resets on restart.
services:
  - type: web
    name: biomantra-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    envVars:
      - key: LAT
        value: "28.4725"
      - key: LON
        value: "77.4889"
      - key: GEOFENCE_RADIUS_KM
        value: "25"
      - key: ADMIN_TOKEN
        generateValue: true
